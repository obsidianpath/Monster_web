<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Монстрик — Хранитель Тишины</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", sans-serif; background: #10152d; color: white; user-select: none; }

    #app {
        position: fixed; inset: 0; overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #202c5c, #0a0e1c 80%);
        transition: background 1s ease;
    }
    #app.warning { background: radial-gradient(circle at 50% 40%, #4a2a2a, #1a0e0e 80%); }
    #app.danger { background: radial-gradient(circle at 50% 40%, #5c1a1a, #1c0a0a 80%); }

    /* Звёзды */
    .star { position: absolute; width: 3px; height: 3px; background: white; border-radius: 50%; animation: twinkle 3s infinite alternate; opacity: 0.7; }
    @keyframes twinkle { from { opacity: 0.2; transform: scale(0.7); } to { opacity: 1; transform: scale(1.2); } }

    /* UI сверху */
    .topbar { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 20; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .logo { font-size: 24px; font-weight: 900; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .stats { display: flex; gap: 15px; }
    .stat { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .stat-label { font-size: 10px; opacity: 0.6; text-transform: uppercase; }
    .stat-value { font-size: 20px; font-weight: 800; }

    /* ThreeJS */
    #scene { position: absolute; inset: 0; z-index: 2; }

    /* UI снизу */
    .bottom-ui { position: absolute; z-index: 10; left: 50%; bottom: 30px; transform: translateX(-50%); width: min(600px, 90%); display: flex; flex-direction: column; gap: 15px; }
    .status-box { background: rgba(10,15,35,0.7); backdrop-filter: blur(15px); padding: 15px 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .status-title { font-size: 22px; font-weight: 900; }
    .status-desc { font-size: 13px; opacity: 0.7; margin-top: 4px; }

    .noise-panel { background: rgba(10,15,35,0.7); backdrop-filter: blur(15px); padding: 15px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .noise-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; font-weight: 700; opacity: 0.8; }
    .meter { width: 100%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; position: relative; }
    .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4caf50, #ffeb3b, #ff5722); border-radius: 10px; transition: width 0.1s; }
    .threshold { position: absolute; top: -2px; bottom: -2px; width: 3px; background: white; box-shadow: 0 0 10px white; left: 60%; transition: left 0.3s; }

    /* Печенька */
    .cookie { position: absolute; width: 80px; height: 80px; cursor: grab; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); transition: transform 0.2s; z-index: 30; }
    .cookie:hover { transform: scale(1.1); }
    .cookie.dragging { cursor: grabbing; transform: scale(1.2); }
    .cookie.hidden { display: none; }

    /* Стартовый экран */
    .start-screen { position: absolute; inset: 0; z-index: 50; background: rgba(7,10,25,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .start-card { background: rgba(18,24,52,0.95); padding: 40px; border-radius: 30px; text-align: center; border: 1px solid rgba(255,255,255,0.1); max-width: 500px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
    .start-card h1 { font-size: 32px; margin-bottom: 10px; }
    .start-card p { opacity: 0.7; line-height: 1.6; margin-bottom: 25px; }
    .start-btn { background: linear-gradient(135deg, #6c63ff, #4d8dff); border: none; padding: 16px 40px; border-radius: 15px; color: white; font-size: 18px; font-weight: 800; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 10px 30px rgba(73,105,255,0.4); }
    .start-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(73,105,255,0.6); }

    /* Настройки */
    .settings-btn { position: absolute; right: 20px; bottom: 20px; z-index: 25; width: 45px; height: 45px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 20px; cursor: pointer; backdrop-filter: blur(10px); }
    .settings-panel { position: absolute; right: 20px; bottom: 75px; z-index: 35; width: 300px; background: rgba(15,19,42,0.98); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 20px; transform: translateY(10px); opacity: 0; pointer-events: none; transition: 0.3s; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .settings-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .settings-panel h3 { font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .setting { margin-bottom: 15px; }
    .setting label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; opacity: 0.8; }
    .setting input { width: 100%; accent-color: #6c63ff; }
</style>
</head>
<body>
<div id="app">
    <div id="stars"></div>

    <div class="topbar">
        <div class="logo">👾 Хранитель Тишины</div>
        <div class="stats">
            <div class="stat"><div class="stat-label">Тихо</div><div class="stat-value" id="quietTimer">0:00</div></div>
            <div class="stat"><div class="stat-label">⭐</div><div class="stat-value" id="starsCount">0</div></div>
        </div>
    </div>

    <div id="scene"></div>

    <div class="bottom-ui">
        <div class="status-box">
            <div class="status-title" id="statusTitle">😴 Монстрик спит</div>
            <div class="status-desc" id="statusDesc">Тишина помогает ему видеть хорошие сны</div>
        </div>
        <div class="noise-panel">
            <div class="noise-header">
                <span>🎤 Уровень шума</span>
                <span id="noiseLevel">Тихо</span>
            </div>
            <div class="meter">
                <div class="meter-fill" id="meterFill"></div>
                <div class="threshold" id="thresholdMarker"></div>
            </div>
        </div>
    </div>

    <!-- Печенька -->
    <svg class="cookie hidden" id="cookie" viewBox="0 0 100 100">
        <defs><radialGradient id="cg" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffe0a3"/><stop offset="70%" stop-color="#d99443"/><stop offset="100%" stop-color="#8c511f"/></radialGradient></defs>
        <circle cx="50" cy="50" r="45" fill="url(#cg)" stroke="#63370f" stroke-width="4"/>
        <circle cx="30" cy="35" r="5" fill="#4a2500"/><circle cx="65" cy="30" r="5" fill="#4a2500"/><circle cx="70" cy="55" r="5" fill="#4a2500"/>
        <circle cx="40" cy="60" r="5" fill="#4a2500"/><circle cx="25" cy="70" r="5" fill="#4a2500"/><circle cx="60" cy="75" r="5" fill="#4a2500"/>
    </svg>

    <!-- Старт -->
    <div class="start-screen" id="startScreen">
        <div class="start-card">
            <div style="font-size: 70px; margin-bottom: 10px;">👾</div>
            <h1>Хранитель Тишины</h1>
            <p>Этот монстрик очень любит спать. Если в классе становится слишком громко, он просыпается и злится! Помогите ему спокойно спать.</p>
            <button class="start-btn" id="startBtn">🎤 Начать урок</button>
        </div>
    </div>

    <!-- Настройки -->
    <button class="settings-btn" id="settingsBtn">⚙️</button>
    <div class="settings-panel" id="settingsPanel">
        <h3>⚙️ Настройки</h3>
        <div class="setting">
            <label><span>Чувствительность</span><b id="sensVal">1.5</b></label>
            <input type="range" id="sensitivity" min="0.5" max="4" step="0.1" value="1.5">
        </div>
        <div class="setting">
            <label><span>Порог пробуждения</span><b id="wakeVal">2 сек</b></label>
            <input type="range" id="wakeDelay" min="1" max="10" step="1" value="2">
        </div>
    </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// DOM
const app = document.getElementById("app");
const sceneContainer = document.getElementById("scene");
const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");
const statusTitle = document.getElementById("statusTitle");
const statusDesc = document.getElementById("statusDesc");
const meterFill = document.getElementById("meterFill");
const noiseLevel = document.getElementById("noiseLevel");
const quietTimer = document.getElementById("quietTimer");
const starsCount = document.getElementById("starsCount");
const cookie = document.getElementById("cookie");
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
const sensitivitySlider = document.getElementById("sensitivity");
const wakeDelaySlider = document.getElementById("wakeDelay");
const sensVal = document.getElementById("sensVal");
const wakeVal = document.getElementById("wakeVal");
const thresholdMarker = document.getElementById("thresholdMarker");

// Звёзды на фоне
for (let i = 0; i < 80; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    document.getElementById("stars").appendChild(star);
}

// ThreeJS Scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0e1c, 0.03);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
sceneContainer.appendChild(renderer.domElement);

// Свет
const hemiLight = new THREE.HemisphereLight(0xaec8ff, 0x17152b, 2.0);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 3.5);
keyLight.position.set(-5, 8, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x7b8cff, 15, 20);
rimLight.position.set(5, 3, -3);
scene.add(rimLight);

const redLight = new THREE.PointLight(0xff3030, 0, 12);
redLight.position.set(0, 2, 5);
scene.add(redLight);

// Монстр
const monster = new THREE.Group();
monster.position.y = -0.5;
scene.add(monster);

// Материалы
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x55c85a, roughness: 0.6, metalness: 0.05 });
const bellyMat = new THREE.MeshStandardMaterial({ color: 0x91e987, roughness: 0.7 });
const hornMat = new THREE.MeshStandardMaterial({ color: 0x6637b8, roughness: 0.4, metalness: 0.1 });
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x050509, roughness: 0.2 });
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x260710, roughness: 0.8 });
const toothMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
const browMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.8 });

// Тело
const body = new THREE.Mesh(new THREE.SphereGeometry(2.8, 64, 48), bodyMat);
body.scale.set(1, 1.1, 0.85);
body.position.y = -0.2;
body.castShadow = true;
body.receiveShadow = true;
monster.add(body);

// Живот
const belly = new THREE.Mesh(new THREE.SphereGeometry(1.9, 48, 32), bellyMat);
belly.scale.set(1, 1.05, 0.3);
belly.position.set(0, -0.7, 2.1);
belly.castShadow = true;
monster.add(belly);

// Рога
function createHorn(x, rot) {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.8, 32), hornMat);
    horn.position.set(x, 2.2, 0.1);
    horn.rotation.z = rot;
    horn.castShadow = true;
    monster.add(horn);
    return horn;
}
const leftHorn = createHorn(-1.7, -0.4);
const rightHorn = createHorn(1.7, 0.4);

// Глаза
const eyes = [];
function createEye(x) {
    const g = new THREE.Group();
    g.position.set(x, 0.7, 2.35);
    
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.7, 40, 32), eyeWhiteMat);
    white.scale.z = 0.5;
    white.castShadow = true;
    g.add(white);
    
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.28, 32, 24), pupilMat);
    pupil.position.z = 0.55;
    g.add(pupil);
    
    const highlight = new THREE.Mesh(new THREE.SphereGeometry(0.08, 20, 20), eyeWhiteMat);
    highlight.position.set(-0.1, 0.15, 0.8);
    g.add(highlight);
    
    // Веко
    const eyelid = new THREE.Mesh(new THREE.SphereGeometry(0.72, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), bodyMat);
    eyelid.position.z = 0.35;
    eyelid.scale.set(1, 1, 0.5);
    eyelid.visible = false;
    g.add(eyelid);
    
    monster.add(g);
    return { group: g, pupil, eyelid, white };
}
const leftEye = createEye(-0.8);
const rightEye = createEye(0.8);

// Брови
const leftBrow = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.1), browMat);
leftBrow.position.set(-0.8, 1.35, 2.5);
leftBrow.rotation.z = 0.2;
leftBrow.visible = false;
monster.add(leftBrow);

const rightBrow = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.1), browMat);
rightBrow.position.set(0.8, 1.35, 2.5);
rightBrow.rotation.z = -0.2;
rightBrow.visible = false;
monster.add(rightBrow);

// Рот
const mouth = new THREE.Mesh(new THREE.SphereGeometry(1.1, 48, 32), mouthMat);
mouth.scale.set(1, 0.3, 0.3);
mouth.position.set(0, -0.9, 2.45);
monster.add(mouth);

// Зубы
const teeth = [];
for (let i = 0; i < 5; i++) {
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.4, 16), toothMat);
    tooth.position.set(-0.5 + i * 0.25, -0.65, 2.7);
    tooth.rotation.z = Math.PI;
    tooth.visible = false;
    monster.add(tooth);
    teeth.push(tooth);
}

// Лапы
function createLimb(x, y, z, sx, sy, sz, rot) {
    const limb = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 24), bodyMat);
    limb.scale.set(sx, sy, sz);
    limb.position.set(x, y, z);
    limb.rotation.z = rot;
    limb.castShadow = true;
    monster.add(limb);
    return limb;
}
const leftArm = createLimb(-2.7, -0.3, 0.2, 0.65, 1.4, 0.65, -0.5);
const rightArm = createLimb(2.7, -0.3, 0.2, 0.65, 1.4, 0.65, 0.5);

const leftFoot = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 24), bodyMat);
leftFoot.scale.set(1.3, 0.6, 1.5);
leftFoot.position.set(-1.2, -3.2, 0.6);
leftFoot.castShadow = true;
monster.add(leftFoot);

const rightFoot = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 24), bodyMat);
rightFoot.scale.set(1.3, 0.6, 1.5);
rightFoot.position.set(1.2, -3.2, 0.6);
rightFoot.castShadow = true;
monster.add(rightFoot);

// Пятна
const spotMat = new THREE.MeshStandardMaterial({ color: 0x2f963f, roughness: 0.8 });
for (let i = 0; i < 10; i++) {
    const spot = new THREE.Mesh(new THREE.SphereGeometry(0.15 + Math.random() * 0.2, 16, 16), spotMat);
    const angle = Math.random() * Math.PI * 2;
    spot.position.set(Math.cos(angle) * (1.5 + Math.random()), -1 + Math.random() * 2, 2.0 + Math.random() * 0.3);
    monster.add(spot);
}

// Логика Монстра
let monsterState = "sleeping"; // sleeping, warning, awake
let targetScale = 1;
let elapsed = 0;
let eyeOpenAmount = 0; // 0 = closed, 1 = open
let growlActive = false;

// Аудио
let audioCtx, analyser, audioData, micSource;
let noiseFloor = 0;
let audioReady = false;

// Настройки
let config = { sensitivity: 1.5, wakeDelay: 2 };
let lessonActive = false;
let noiseStartTime = null;
let lastLoudTime = 0;
let quietStartTime = performance.now();

// Рычание
const growlSound = new Audio('roar.mp3');
growlSound.volume = 0.7;

// Старт
startBtn.addEventListener('click', async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();
        micSource = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.4;
        micSource.connect(analyser);
        audioData = new Uint8Array(analyser.fftSize);

        startScreen.style.opacity = '0';
        setTimeout(() => startScreen.style.display = 'none', 500);
        statusTitle.textContent = '🎤 Калибровка...';
        statusDesc.textContent = 'Секунду, монстрик прислушивается к тишине';
        
        // Калибровка
        const samples = [];
        const calStart = performance.now();
        const calInterval = setInterval(() => {
            analyser.getByteTimeDomainData(audioData);
            let sum = 0;
            for (let i = 0; i < audioData.length; i++) {
                const v = (audioData[i] - 128) / 128;
                sum += v * v;
            }
            samples.push(Math.sqrt(sum / audioData.length));
            if (performance.now() - calStart > 2000) {
                clearInterval(calInterval);
                samples.sort((a,b) => a-b);
                const p80 = samples[Math.floor(samples.length * 0.8)] || 0;
                noiseFloor = Math.max(p80 * config.sensitivity, 0.015);
                audioReady = true;
                quietStartTime = performance.now();
                statusTitle.textContent = '😴 Монстрик спит';
                statusDesc.textContent = 'Сохраняйте тишину, чтобы он не проснулся';
                requestAnimationFrame(loop);
            }
        }, 50);
        
        // Показываем печеньку
        positionCookie();
        cookie.classList.remove('hidden');
        
    } catch (e) {
        alert('Нужен доступ к микрофону!\n' + e.message);
    }
});

function loop(now) {
    requestAnimationFrame(loop);
    const delta = Math.min(0.05, (now - (loop.last || now)) / 1000);
    loop.last = now;
    elapsed += delta;

    // Анализ звука
    if (audioReady) {
        analyser.getByteTimeDomainData(audioData);
        let sum = 0;
        for (let i = 0; i < audioData.length; i++) {
            const v = (audioData[i] - 128) / 128;
            sum += v * v;
        }
        const rms = Math.sqrt(sum / audioData.length);
        let level = Math.max(0, rms - noiseFloor) * config.sensitivity * 8;
        const noise = Math.min(1, level);
        
        meterFill.style.width = (noise * 100) + '%';
        thresholdMarker.style.left = (Math.min(1, noiseFloor * config.sensitivity * 8 / 0.7) * 100) + '%';

        if (noise < 0.25) noiseLevel.textContent = '🤫 Тихо';
        else if (noise < 0.55) noiseLevel.textContent = '🙂 Нормально';
        else if (noise < 0.75) noiseLevel.textContent = '😮 Громко';
        else noiseLevel.textContent = '😡 Слишком громко';

        updateLogic(noise, now);
    }

    // Анимация
    animateMonster(delta);
    
    // Таймер тишины
    if (monsterState !== 'awake') {
        const quietSec = (now - quietStartTime) / 1000;
        const m = Math.floor(quietSec / 60);
        const s = Math.floor(quietSec % 60);
        quietTimer.textContent = m + ':' + String(s).padStart(2, '0');
    }

    renderer.render(scene, camera);
}

function updateLogic(noise, now) {
    const loud = noise > 0.58;
    if (loud) {
        if (noiseStartTime === null) noiseStartTime = now;
        const duration = (now - noiseStartTime) / 1000;
        if (duration >= config.wakeDelay) {
            wakeMonster();
        } else if (monsterState === 'sleeping') {
            setWarning();
        }
    } else {
        noiseStartTime = null;
        if (monsterState === 'awake') {
            if (noise < 0.3) {
                if (!lastLoudTime || now - lastLoudTime > 3000) {
                    calmMonster();
                }
            } else {
                lastLoudTime = now;
            }
        } else if (monsterState === 'warning') {
            sleepMonster();
        }
    }
}

function setWarning() {
    if (monsterState === 'warning') return;
    monsterState = 'warning';
    app.classList.add('warning');
    app.classList.remove('danger');
    redLight.intensity = 2;
    statusTitle.textContent = '😮 Кажется, становится громко...';
    statusDesc.textContent = 'Монстрик начинает просыпаться';
    targetScale = 1.03;
    // Приоткрываем один глаз
    eyeOpenAmount = 0.3;
}

function wakeMonster() {
    if (monsterState === 'awake') return;
    monsterState = 'awake';
    app.classList.remove('warning');
    app.classList.add('danger');
    redLight.intensity = 8;
    targetScale = 1.08;
    statusTitle.textContent = '😡 ОЙ! МОНСТРИК ПРОСНУЛСЯ!';
    statusDesc.textContent = 'Нужно снова сделать тихо или дать печеньку';
    eyeOpenAmount = 1;
    quietStartTime = performance.now();
    
    if (!growlActive) {
        growlActive = true;
        growlSound.currentTime = 0;
        growlSound.play().catch(() => {});
        setTimeout(() => growlActive = false, 3000);
    }
}

function calmMonster() {
    if (monsterState !== 'awake') return;
    monsterState = 'warning';
    app.classList.remove('danger');
    app.classList.add('warning');
    redLight.intensity = 3;
    statusTitle.textContent = '😮 Монстрик успокаивается...';
    statusDesc.textContent = 'Ещё немного тишины, и он уснёт';
    targetScale = 1.04;
    eyeOpenAmount = 0.5;
    setTimeout(() => {
        if (monsterState === 'warning') sleepMonster();
    }, 1500);
}

function sleepMonster() {
    monsterState = 'sleeping';
    app.classList.remove('warning', 'danger');
    redLight.intensity = 0;
    targetScale = 1;
    statusTitle.textContent = '😴 Монстрик снова спит';
    statusDesc.textContent = 'Отлично! Продолжаем сохранять тишину';
    eyeOpenAmount = 0;
    quietStartTime = performance.now();
}

// Анимация монстра
function animateMonster(delta) {
    const breathing = 1 + Math.sin(elapsed * 1.5) * 0.03;
    monster.scale.set(targetScale * breathing, targetScale * breathing, targetScale * breathing);

    // Позиция
    if (monsterState === 'sleeping') {
        monster.position.y = -0.5 + Math.sin(elapsed * 1.2) * 0.15;
        monster.rotation.z = Math.sin(elapsed * 0.6) * 0.01;
    } else if (monsterState === 'warning') {
        monster.position.y = -0.45 + Math.sin(elapsed * 6) * 0.05;
        monster.rotation.z = Math.sin(elapsed * 8) * 0.02;
    } else if (monsterState === 'awake') {
        monster.position.y = -0.5 + Math.sin(elapsed * 25) * 0.08;
        monster.rotation.z = Math.sin(elapsed * 22) * 0.08;
        monster.rotation.x = Math.sin(elapsed * 19) * 0.03;
    }

    // Глаза
    const targetEye = eyeOpenAmount;
    leftEye.white.scale.y += (targetEye - leftEye.white.scale.y) * 0.1;
    rightEye.white.scale.y += (targetEye - rightEye.white.scale.y) * 0.1;
    
    leftEye.pupil.visible = targetEye > 0.2;
    rightEye.pupil.visible = targetEye > 0.2;
    
    // Зрачки двигаются
    const pupilX = Math.sin(elapsed * 0.8) * 0.15;
    const pupilY = targetEye > 0.5 ? 0 : -0.1;
    leftEye.pupil.position.x = pupilX;
    rightEye.pupil.position.x = pupilX;
    leftEye.pupil.position.y = pupilY;
    rightEye.pupil.position.y = pupilY;

    // Зрачки сужаются при злости
    if (monsterState === 'awake') {
        leftEye.pupil.scale.set(0.7, 0.7, 0.7);
        rightEye.pupil.scale.set(0.7, 0.7, 0.7);
    } else {
        leftEye.pupil.scale.set(1, 1, 1);
        rightEye.pupil.scale.set(1, 1, 1);
    }

    // Веки
    leftEye.eyelid.visible = targetEye < 0.5;
    rightEye.eyelid.visible = targetEye < 0.5;

    // Брови
    leftBrow.visible = monsterState === 'awake';
    rightBrow.visible = monsterState === 'awake';
    if (monsterState === 'awake') {
        leftBrow.position.y = 1.35 + Math.sin(elapsed * 15) * 0.05;
        rightBrow.position.y = 1.35 + Math.sin(elapsed * 15 + 1) * 0.05;
    }

    // Зубы
    teeth.forEach(t => t.visible = monsterState === 'awake');
    
    // Рот
    if (monsterState === 'awake') {
        mouth.scale.set(1.2, 0.5, 0.3);
        mouth.position.y = -0.95;
    } else {
        mouth.scale.set(1, 0.3, 0.3);
        mouth.position.y = -0.9;
    }

    // Рога
    leftHorn.rotation.z = -0.4 - (monsterState === 'awake' ? Math.sin(elapsed * 15) * 0.1 : 0);
    rightHorn.rotation.z = 0.4 + (monsterState === 'awake' ? Math.sin(elapsed * 15) * 0.1 : 0);

    // Камера
    camera.position.x = Math.sin(now * 0.0003) * 0.1;
    camera.position.y = 0.5 + Math.sin(now * 0.0004) * 0.03;
    camera.lookAt(0, -0.2, 0);
}

// Печенька
let draggingCookie = false;
let cookieOffsetX = 0, cookieOffsetY = 0;

function positionCookie() {
    cookie.style.left = (window.innerWidth - 120) + 'px';
    cookie.style.top = (window.innerHeight - 180) + 'px';
}

cookie.addEventListener('pointerdown', (e) => {
    draggingCookie = true;
    cookie.classList.add('dragging');
    const rect = cookie.getBoundingClientRect();
    cookieOffsetX = e.clientX - rect.left;
    cookieOffsetY = e.clientY - rect.top;
    cookie.setPointerCapture(e.pointerId);
});

cookie.addEventListener('pointermove', (e) => {
    if (!draggingCookie) return;
    cookie.style.left = (e.clientX - cookieOffsetX) + 'px';
    cookie.style.top = (e.clientY - cookieOffsetY) + 'px';
});

cookie.addEventListener('pointerup', () => {
    if (!draggingCookie) return;
    draggingCookie = false;
    cookie.classList.remove('dragging');
    
    const c = cookie.getBoundingClientRect();
    const cx = c.left + c.width / 2;
    const cy = c.top + c.height / 2;
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;
    const dist = Math.sqrt((cx - centerX)**2 + (cy - centerY)**2);
    
    if (dist < 250) {
        feedMonster();
    } else {
        positionCookie();
    }
});

function feedMonster() {
    cookie.animate([
        { transform: 'scale(1) rotate(0)' },
        { transform: 'scale(0.3) rotate(720deg)' }
    ], { duration: 500, easing: 'cubic-bezier(0.2, 0.9, 0.3, 1)' });
    
    setTimeout(() => {
        // Мгновенно успокаиваем
        monsterState = 'sleeping';
        app.classList.remove('warning', 'danger');
        redLight.intensity = 0;
        targetScale = 1;
        eyeOpenAmount = 0;
        statusTitle.textContent = '🍪 Ням-ням!';
        statusDesc.textContent = 'Монстрик съел печеньку и стал добрее';
        quietStartTime = performance.now();
        
        setTimeout(() => {
            statusTitle.textContent = '😴 Монстрик снова спит';
            statusDesc.textContent = 'Продолжаем сохранять тишину';
        }, 2000);
        
        positionCookie();
    }, 500);
}

// Настройки
settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('open'));

sensitivitySlider.addEventListener('input', () => {
    config.sensitivity = Number(sensitivitySlider.value);
    sensVal.textContent = config.sensitivity.toFixed(1);
    if (audioReady) {
        noiseFloor = Math.max(0.015, noiseFloor * (config.sensitivity / 1.5));
    }
});

wakeDelaySlider.addEventListener('input', () => {
    config.wakeDelay = Number(wakeDelaySlider.value);
    wakeVal.textContent = config.wakeDelay + ' сек';
});

// Ресайз
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (!draggingCookie) positionCookie();
});
</script>
