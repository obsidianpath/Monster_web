<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Монстрик-Хранитель Тишины</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    user-select: none;
  }

  /* Фон — мягкий градиент, приятный детям */
  body {
    background: linear-gradient(180deg, #2b1055 0%, #7597de 50%, #a8d8ea 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 1.2s ease;
  }

  /* Когда монстрик злится — фон краснеет */
  body.awake {
    background: linear-gradient(180deg, #4a0e0e 0%, #b83b3b 50%, #ff8b6b 100%);
  }

  /* Звёздочки на фоне */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 80% 20%, #fff, transparent),
      radial-gradient(2px 2px at 35% 80%, #fff, transparent),
      radial-gradient(1px 1px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 10% 60%, #fff, transparent);
    opacity: 0.7;
    animation: twinkle 4s infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.4 } to { opacity: 0.9 } }

  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* ====== МОНСТРИК ====== */
  .monster {
    position: relative;
    width: 300px;
    height: 340px;
    cursor: pointer;
    transition: transform 0.4s ease;
    animation: breathe 3.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-8px) scale(1.02); }
  }

  /* Лёгкое подрагивание при пробуждении */
  .monster.awake {
    animation: shake 0.35s ease-in-out infinite;
  }
  @keyframes shake {
    0%,100% { transform: translate(0,0) rotate(0); }
    25%     { transform: translate(-4px,-2px) rotate(-2deg); }
    75%     { transform: translate(4px,-2px) rotate(2deg); }
  }

  /* Тело */
  .body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 240px;
    background: radial-gradient(circle at 35% 30%, #a0f0a0, #4caf50 60%, #2e7d32 100%);
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    box-shadow: inset -12px -12px 30px rgba(0,0,0,0.25),
                inset 12px 12px 25px rgba(255,255,255,0.35),
                0 15px 35px rgba(0,0,0,0.35);
    transition: background 0.8s ease;
  }
  .monster.awake .body {
    background: radial-gradient(circle at 35% 30%, #ffb3b3, #e53935 60%, #8e0000 100%);
  }

  /* Пятнышки на теле */
  .spot {
    position: absolute;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
  }
  .spot.s1 { width: 30px; height: 30px; top: 60px; left: 40px; }
  .spot.s2 { width: 20px; height: 20px; top: 120px; left: 25px; }
  .spot.s3 { width: 40px; height: 40px; top: 150px; right: 45px; }
  .spot.s4 { width: 18px; height: 18px; top: 70px; right: 60px; }

  /* Глаз (большой, циклоп) */
  .eye {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 110px;
    background: #fff;
    border-radius: 50%;
    border: 6px solid #1b3a1b;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
    overflow: hidden;
    transition: height 0.4s ease, border-color 0.8s ease;
  }
  .monster.awake .eye { border-color: #4a0e0e; }

  /* Зрачок */
  .pupil {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: #111;
    border-radius: 50%;
    transition: all 0.4s ease;
  }
  .pupil::after {
    content: '';
    position: absolute;
    top: 8px;
    left: 10px;
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.9;
  }

  /* Сонное веко */
  .eyelid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #4caf50;
    transform: translateY(0);
    transition: transform 0.5s ease, background 0.8s ease;
    border-radius: 50%;
  }
  .monster.awake .eyelid {
    transform: translateY(-110%);
    background: #e53935;
  }

  /* Рот */
  .mouth {
    position: absolute;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 25px;
    background: #1b3a1b;
    border-radius: 0 0 60px 60px;
    transition: all 0.4s ease;
  }
  .monster.awake .mouth {
    height: 55px;
    width: 90px;
    border-radius: 50%;
    background: #4a0e0e;
    box-shadow: inset 0 0 15px #000;
  }

  /* Зубы */
  .teeth {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .monster.awake .teeth { opacity: 1; }
  .tooth {
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 14px solid #fff;
  }

  /* Рожки */
  .horn {
    position: absolute;
    top: 20px;
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-bottom: 40px solid #2e7d32;
    transition: border-bottom-color 0.8s ease;
  }
  .horn.left  { left: 30px;  transform: rotate(-25deg); }
  .horn.right { right: 30px; transform: rotate(25deg); }
  .monster.awake .horn { border-bottom-color: #8e0000; }

  /* Лапки */
  .paw {
    position: absolute;
    bottom: -10px;
    width: 60px;
    height: 40px;
    background: #2e7d32;
    border-radius: 50%;
    transition: background 0.8s ease;
  }
  .paw.left  { left: 30px; }
  .paw.right { right: 30px; }
  .monster.awake .paw { background: #8e0000; }

  /* Zzz при сне */
  .zzz {
    position: absolute;
    top: 40px;
    right: 20px;
    font-size: 28px;
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 10px #a8d8ea;
    opacity: 1;
    transition: opacity 0.4s ease;
    animation: floatZ 2.5s ease-in-out infinite;
  }
  @keyframes floatZ {
    0%,100% { transform: translateY(0); opacity: 0.6; }
    50%     { transform: translateY(-15px); opacity: 1; }
  }
  .monster.awake .zzz { opacity: 0; }

  /* ====== ИНДИКАТОР ГРОМКОСТИ ====== */
  .meter {
    width: 320px;
    height: 22px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.4);
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4caf50, #ffeb3b, #ff5722);
    border-radius: 20px;
    transition: width 0.08s linear;
  }

  .status {
    font-size: 26px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    font-weight: bold;
    letter-spacing: 1px;
    text-align: center;
    transition: color 0.4s ease;
  }
  .status.awake { color: #ffe0b2; }

  /* Кнопка запуска (нужна для доступа к микрофону) */
  .start-btn {
    padding: 18px 42px;
    font-size: 22px;
    font-family: inherit;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ff9800, #f44336);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .start-btn:hover  { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 28px rgba(0,0,0,0.5); }
  .start-btn:active { transform: scale(0.97); }

  .hint {
    color: #fff;
    opacity: 0.8;
    font-size: 15px;
    text-align: center;
    max-width: 420px;
  }

  .hidden { display: none !important; }

  /* Кнопка перезапуска */
  .reset-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 15px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 30px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: background 0.2s;
    z-index: 10;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.35); }
</style>
</head>
<body>

<div class="stars"></div>

<!-- ЭКРАН ЗАПУСКА -->
<div id="startScreen" class="stage">
  <div style="font-size:80px;">👾</div>
  <h1 style="color:#fff;font-size:32px;text-shadow:0 2px 10px rgba(0,0,0,0.5);">Монстрик-Хранитель Тишины</h1>
  <p class="hint">Нажми кнопку, разреши доступ к микрофону — и монстрик будет спать, пока в классе тихо. Но если станет шумно… он проснётся! 🤫</p>
  <button class="start-btn" id="startBtn">▶ Запустить монстрика</button>
</div>

<!-- ОСНОВНАЯ СЦЕНА -->
<div id="mainScreen" class="stage hidden">
  <div class="status" id="status">😴 Тихо… монстрик спит</div>

  <div class="monster" id="monster">
    <div class="horn left"></div>
    <div class="horn right"></div>

    <div class="body">
      <div class="spot s1"></div>
      <div class="spot s2"></div>
      <div class="spot s3"></div>
      <div class="spot s4"></div>
    </div>

    <div class="eye">
      <div class="pupil"></div>
      <div class="eyelid"></div>
    </div>

    <div class="mouth">
      <div class="teeth">
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
      </div>
    </div>

    <div class="paw left"></div>
    <div class="paw right"></div>

    <div class="zzz">Z z z</div>
  </div>

  <div class="meter">
    <div class="meter-fill" id="meterFill"></div>
  </div>
</div>

<button class="reset-btn hidden" id="resetBtn">🔄 Сброс</button>

<script>
/* ============================================================
   ЛОГИКА МОНСТРИКА
   - слушаем микрофон
   - считаем громкость
   - если выше порога — монстрик "просыпается"
   - если тихо N секунд — засыпает обратно
   ============================================================ */

const startScreen = document.getElementById('startScreen');
const mainScreen  = document.getElementById('mainScreen');
const startBtn    = document.getElementById('startBtn');
const resetBtn    = document.getElementById('resetBtn');
const monsterEl   = document.getElementById('monster');
const meterFill   = document.getElementById('meterFill');
const statusEl    = document.getElementById('status');

// Порог громкости (0..1). Подберите под класс.
const WAKE_THRESHOLD = 0.12;
// Сколько миллисекунд должно быть тихо, чтобы монстрик заснул
const SLEEP_DELAY = 2500;

let audioCtx, analyser, dataArray, source;
let isAwake = false;
let lastLoudTime = Date.now();
let animationId;

startBtn.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    source   = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.fftSize);

    startScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');
    resetBtn.classList.remove('hidden');

    listenLoop();
  } catch (err) {
    alert('Не удалось получить доступ к микрофону. Разрешите доступ в браузере и попробуйте снова.\n\n' + err.message);
  }
});

resetBtn.addEventListener('click', () => {
  location.reload();
});

function listenLoop() {
  analyser.getByteTimeDomainData(dataArray);

  // Среднеквадратичная амплитуда (RMS)
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const v = (dataArray[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / dataArray.length);

  // Визуализация шкалы
  const displayLevel = Math.min(rms * 4, 1);
  meterFill.style.width = (displayLevel * 100) + '%';

  const now = Date.now();

  if (rms > WAKE_THRESHOLD) {
    lastLoudTime = now;
    if (!isAwake) wakeUp();
  } else {
    if (isAwake && now - lastLoudTime > SLEEP_DELAY) {
      goToSleep();
    }
  }

  animationId = requestAnimationFrame(listenLoop);
}

function wakeUp() {
  isAwake = true;
  monsterEl.classList.add('awake');
  document.body.classList.add('awake');
  statusEl.classList.add('awake');
  statusEl.textContent = '😡 Тихо! Монстрик проснулся!';
  playGrowl();
}

function goToSleep() {
  isAwake = false;
  monsterEl.classList.remove('awake');
  document.body.classList.remove('awake');
  statusEl.classList.remove('awake');
  statusEl.textContent = '😴 Тихо… монстрик спит';
}

/* Простое "рычание" через Web Audio — без внешних файлов */
function playGrowl() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.exponentialRampToValueAtTime(60, t + 0.6);

  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 22;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 25;
  lfo.connect(lfoGain).connect(osc.frequency);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.15, t + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);

  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); lfo.start(t);
  osc.stop(t + 0.75); lfo.stop(t + 0.75);
}
</script>
</body>
</html>
